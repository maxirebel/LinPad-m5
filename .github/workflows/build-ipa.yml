# Builds an unsigned LinPad IPA on a GitHub-hosted Apple Silicon Mac.
#
# The result is NOT signed: install it with iloader / SideStore / Sideloadly, which sign
# it with your own Apple ID at install time (7-day certificate on a free account).
#
# Why this exists: LinPad's emulator builds only on an aarch64 host (meson.build requires
# an arm64 guest on an aarch64 host), so a Mac is mandatory. This workflow lends you
# GitHub's macOS runner instead of owning one.
#
# Run it from the Actions tab (Run workflow), or push a v* tag. It downloads the official
# rootfs asset of the release instead of rebuilding it (~50 min saved), builds the GPU
# libraries once and caches them, then compiles the app.
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: Rootfs tarball to embed (the official release asset by default)
        required: false
        default: https://github.com/fspecii/LinPad/releases/download/v1.5.0/linpad-rootfs-1.5.0.tar.gz
      rootfs_sha256:
        description: SHA-256 of that tarball (empty to skip the check)
        required: false
        default: b5e852cfe2d9763863323895a6f94194ac980b226926a6f6aba27c5f5e41ea9b
      rootfs_version:
        description: Value written to root.version inside the app
        required: false
        default: "1.5.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  APP_NAME: iSH ARM64

jobs:
  ipa:
    name: Build the app and package an IPA
    # Apple Silicon: the emulator needs an aarch64 host.
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The submodules are fetched by the next step at the upstream pins: this repo
          # was re-created from an archive, so it has no gitlinks for checkout to follow.
          submodules: false
          fetch-depth: 1

      - name: Fetch the pinned submodule sources
        run: |
          fetch_at() {
            dir=$1; url=$2; sha=$3
            rm -rf "$dir"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            if ! git -C "$dir" fetch -q --depth 1 origin "$sha"; then
              echo "shallow fetch failed for $dir, falling back to a full fetch"
              git -C "$dir" fetch -q origin
            fi
            git -C "$dir" checkout -q "$sha"
            echo "$dir @ $(git -C "$dir" rev-parse --short HEAD), $(git -C "$dir" ls-files | wc -l) files"
          }
          # Pins from fspecii/LinPad main (deps/libarchive and deps/libapps gitlinks).
          fetch_at deps/libarchive https://github.com/libarchive/libarchive fc6563f5130d8a7ee1fc27c0e55baef35119f26c
          fetch_at deps/libapps https://github.com/ish-app/libapps b8cacae35e5b11d64bb736a053921c16ca7faf9e
          ls deps/libarchive/libarchive/archive_write_set_format_raw.c
          ls deps/libapps/hterm/bin/mkdist

      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m
          echo "--- schemes"
          xcodebuild -list -project iSH.xcodeproj | sed -n '/Schemes:/,$p'

      - name: Install build tools
        run: |
          brew install llvm lld meson ninja libarchive pkg-config
          # llvm and lld are keg-only.
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          # gpu/build-third-party.sh needs Python's mako, and the runner's python3 is
          # externally managed, so install it into a venv and put it on PYTHONPATH.
          python3 -m venv "$RUNNER_TEMP/mako"
          "$RUNNER_TEMP/mako/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/mako/bin/pip" install --quiet mako
          SITE=$("$RUNNER_TEMP/mako/bin/python3" -c 'import site; print(site.getsitepackages()[0])')
          echo "$RUNNER_TEMP/mako/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$SITE" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mako/bin/python3" -c 'import mako; print("mako", mako.__version__)'
          pkg-config --version

      - name: Cache the GPU libraries
        id: gpu-cache
        uses: actions/cache@v4
        with:
          path: |
            gpu/downloads
            gpu/third_party
            gpu/prefix-ios
            gpu/.ios-built
          key: gpu-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpu/build-third-party.sh', 'gpu/*.sh', 'gpu/patches/**') }}
          restore-keys: |
            gpu-ios-${{ runner.os }}-${{ runner.arch }}-

      - name: Build virglrenderer and MoltenVK for the device
        run: |
          if [ -f gpu/.ios-built ] && [ -f gpu/prefix-ios/lib/libvirglrenderer.a ]; then
            echo "using the cached GPU build"
          else
            gpu/build-third-party.sh ios 2>&1 | tee -a build.log
            touch gpu/.ios-built
          fi
          ls -la gpu/prefix-ios/lib

      - name: Cache the rootfs tarball
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: release/out/rootfs.tar.gz
          key: rootfs-${{ github.event.inputs.rootfs_sha256 || 'release-1.5.0' }}

      - name: Fetch the rootfs that goes inside the app
        env:
          ROOTFS_URL: ${{ github.event.inputs.rootfs_url || 'https://github.com/fspecii/LinPad/releases/download/v1.5.0/linpad-rootfs-1.5.0.tar.gz' }}
          ROOTFS_SHA: ${{ github.event.inputs.rootfs_sha256 || 'b5e852cfe2d9763863323895a6f94194ac980b226926a6f6aba27c5f5e41ea9b' }}
        run: |
          mkdir -p release/out
          if [ ! -s release/out/rootfs.tar.gz ]; then
            echo "downloading $ROOTFS_URL"
            curl -fL --retry 3 -o release/out/rootfs.tar.gz.part "$ROOTFS_URL"
            mv release/out/rootfs.tar.gz.part release/out/rootfs.tar.gz
          fi
          if [ -n "$ROOTFS_SHA" ]; then
            echo "$ROOTFS_SHA  release/out/rootfs.tar.gz" | shasum -a 256 -c -
          fi
          ls -lh release/out/rootfs.tar.gz

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -skipMacroValidation \
            -project iSH.xcodeproj -scheme iSH-ARM64 -configuration Release \
            -destination generic/platform=iOS \
            SYMROOT="$PWD/build-ios-release" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ISH_JIT_BUILD=enabled \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Show the compile errors
        if: failure()
        run: |
          echo "--- lines with error:"
          grep -n -m 40 "error:" build.log || echo "no error: lines in build.log"
          echo "--- last 40 lines:"
          tail -n 40 build.log

      - name: Check the app
        run: |
          APP="build-ios-release/Release-iphoneos/$APP_NAME.app"
          [ -d "$APP" ] || { echo "::error::the build produced no app at $APP"; exit 1; }
          ls -lh "$APP/$APP_NAME"
          echo "--- is the JIT compiled in?"
          nm "$APP/$APP_NAME" | grep -c ish_jit_try_enable || true

      - name: Put the rootfs inside the app
        run: |
          APP="build-ios-release/Release-iphoneos/$APP_NAME.app"
          VERSION="${{ github.event.inputs.rootfs_version || '1.5.0' }}"
          cp release/out/rootfs.tar.gz "$APP/root.tar.gz"
          printf '%s\n' "$VERSION" > "$APP/root.version"
          ls -lh "$APP/root.tar.gz" "$APP/root.version"
          du -sh "$APP"

      - name: Package the IPA
        run: |
          APP="build-ios-release/Release-iphoneos/$APP_NAME.app"
          NAME="LinPad-$(printf '%s' "${{ github.event.inputs.rootfs_version || '1.5.0' }}")-unsigned.ipa"
          rm -rf out "$NAME"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # No code signature on purpose: the sideloader signs it with your Apple ID.
          (cd out && zip -qry "../$NAME" Payload)
          shasum -a 256 "$NAME" | tee "$NAME.sha256"
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinPad-unsigned-ipa
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
